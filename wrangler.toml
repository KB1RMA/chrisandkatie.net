"$schema" = "./node_modules/wrangler/config-schema.json"
main = "worker.ts"
name = "chrisandkatiedotnet"
# Set this to today's date
compatibility_date = "2026-02-22"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
# Base URL used by Auth.js when running via wrangler dev locally
AUTH_URL = "http://localhost:8787"
NEXTAUTH_URL = "http://localhost:8787"
OWNER_EMAIL = "owner@example.com"

[images]
binding = "IMAGES"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "prisma-demo-db-local"
database_id = "adf4fe80-e376-4096-8655-8a7479ac844c"

[[queues.producers]]
queue = "rsvp-notification-queue"
binding = "RSVP_NOTIFICATION_QUEUE"

[[queues.consumers]]
queue = "rsvp-notification-queue"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3

[env.production]
vars = { ANALYTICS_ENABLED = "true", AUTH_URL = "https://chrisandkatie.net", NEXTAUTH_URL = "https://chrisandkatie.net" }

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ANALYTICS"

[[env.production.d1_databases]]
binding = "DB"
database_name = "prisma-demo-db"
database_id = "73260722-51d9-4a90-961e-00d066b5dbb4"

[[env.production.queues.producers]]
queue = "rsvp-notification-queue"
binding = "RSVP_NOTIFICATION_QUEUE"

[[env.production.queues.consumers]]
queue = "rsvp-notification-queue"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3

[env.production.images]
binding = "IMAGES"

[env.staging]
vars = { ANALYTICS_ENABLED = "false", AUTH_URL = "https://staging.chrisandkatie.net", NEXTAUTH_URL = "https://staging.chrisandkatie.net" }

[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ANALYTICS"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "prisma-demo-db"
database_id = "73260722-51d9-4a90-961e-00d066b5dbb4"

[[env.staging.queues.producers]]
queue = "rsvp-notification-queue"
binding = "RSVP_NOTIFICATION_QUEUE"

[[env.staging.queues.consumers]]
queue = "rsvp-notification-queue"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3

[env.staging.images]
binding = "IMAGES"


# ---------------------------------------------------------------------------
# Cloudflare WAF Rate Limiting — Invitation Code Recovery
# ---------------------------------------------------------------------------
#
# The /rsvp/recover endpoint is protected by a Cloudflare WAF Rate Limiting
# rule configured in the Cloudflare dashboard. This rule CANNOT be expressed
# as a wrangler.toml stanza and must be created manually for each environment.
#
# Rule configuration (apply to both "production" and "staging" environments):
#
#   Expression:  http.request.method eq "POST" and
#                http.request.uri.path contains "/rsvp/recover"
#   Threshold:   5 requests per 60 seconds per IP
#   Action:      Block (returns HTTP 429)
#
# Dashboard path:
#   Cloudflare Dashboard → <zone> → Security → WAF → Rate limiting rules
# ---------------------------------------------------------------------------
