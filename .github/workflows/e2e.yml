name: E2E Tests
run-name: E2E Tests

permissions:
  contents: read
  checks: write

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app for Cloudflare Workers
        run: npx opennextjs-cloudflare build

      - name: Create .dev.vars for local worker environment
        # Provides the env vars that wrangler dev passes to the Worker.
        # AUTH_SECRET is required by Auth.js to sign JWTs.
        # ADMIN_USERNAME/ADMIN_PASSWORD are required for admin login tests.
        run: |
          echo "AUTH_SECRET=${{ secrets.E2E_AUTH_SECRET || 'e2e-test-secret-not-for-production' }}" >> .dev.vars
          echo "ADMIN_USERNAME=${{ secrets.E2E_ADMIN_USERNAME || 'admin' }}" >> .dev.vars
          echo "ADMIN_PASSWORD=${{ secrets.E2E_ADMIN_PASSWORD || 'testpassword' }}" >> .dev.vars

      - name: Debug — wrangler version and D1 state
        if: always()
        run: |
          npx wrangler --version
          echo "--- .wrangler/state tree ---"
          find .wrangler/state -type f 2>/dev/null || echo "(no files found)"

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
