<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pastel background -->
  <circle cx="50" cy="50" r="50" fill="#fff5f7"/>

  <!-- Left heart -->
  <path d="M35 65 C 25 55, 20 48, 20 40 C 20 32, 26 26, 32 26 C 36 26, 40 29, 42 33 C 43 30, 45 26, 50 26 C 50 26, 50 45, 50 65 Z" fill="#d81b60" opacity="0.85"/>

  <!-- Right heart -->
  <path d="M65 65 C 75 55, 80 48, 80 40 C 80 32, 74 26, 68 26 C 64 26, 60 29, 58 33 C 57 30, 55 26, 50 26 C 50 26, 50 45, 50 65 Z" fill="#c2185b"/>

  <!-- Initial "C" on left heart -->
  <text x="35" y="52" font-family="serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">C</text>

  <!-- Ampersand in center -->
  <text x="50" y="52" font-family="serif" font-size="12" font-weight="bold" fill="#ffd700" text-anchor="middle" dominant-baseline="middle">&amp;</text>

  <!-- Initial "K" on right heart -->
  <text x="65" y="52" font-family="serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">K</text>

  <!-- Gold ring accent at bottom -->
  <circle cx="50" cy="60" r="5" fill="none" stroke="#ffd700" stroke-width="1.2" opacity="0.8"/>
  <circle cx="50" cy="58" r="0.8" fill="#ffd700"/>

  <!-- Small sparkles -->
  <circle cx="25" cy="25" r="1.5" fill="#e91e63" opacity="0.6"/>
  <circle cx="75" cy="25" r="1.5" fill="#e91e63" opacity="0.6"/>
</svg>
